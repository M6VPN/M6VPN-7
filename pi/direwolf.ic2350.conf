# IC-2350 receive-only AX.25 / packet setup

ADEVICE plughw:0,0
ACHANNELS 1

CHANNEL 0
MYCALL M6VPN

MODEM 1200
# MODEM 1200 1200:2200 E+
FIX_BITS 1 AX25


PTT /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_0001-if00-port0 RTS

TXDELAY 30
TXTAIL 10
DWAIT 0
SLOTTIME 10
PERSIST 63
# No transmit audio configured.

# TNC Interfaces
AGWPORT 8000
KISSPORT 8001
